# mihomo (clash-meta) 配置：加载远程 Clash 订阅，聚合全部节点做负载均衡
# aar 容器内访问 127.0.0.1:1081 即走订阅里所有节点（自动轮换），绕过 OpenAI 数据中心 IP 风控
#
# 使用：把下面 SUBSCRIPTION_URL 替换成你的 Clash 订阅链接（含 &clash=3&extend=1 等参数）
# 或通过环境变量 MOHOMO_SUB_URL 注入（见 docker-compose.yml 的 mihomo entrypoint）
mixed-port: 1081
allow-lan: true
mode: rule
log-level: info

proxy-providers:
  sub:
    type: http
    url: "SUBSCRIPTION_URL_PLACEHOLDER"
    interval: 3600
    path: ./sub.yaml
    health-check:
      enable: true
      interval: 300
      url: https://www.gstatic.com/generate_204

proxy-groups:
  - name: LB
    type: load-balance
    url: https://www.gstatic.com/generate_204
    interval: 300
    strategy: round-robin
    proxies:
      - sub

rules:
  - MATCH,LB
