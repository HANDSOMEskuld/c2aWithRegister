# 合并部署：chatgpt2api（反代消费端）+ any-auto-register（注册生产端）+ glue（接口胶水）
# 两项目原版代码均不修改，仅通过 glue 把 any-auto-register 注册产出的账号转发入库 chatgpt2api，
# 并支持自动注册调度（c2a 可用账号不足时自动调 aar 注册）。
#
# 访问入口（宿主机）：
#   3080 → chatgpt2api(原版, :80)   普通 chatgpt2api 使用，原生直连（glue 不挡在前面）
#   8000 → any-auto-register(原版控制台)  注册端
#   8080 → glue 管理 API（/healthz /sync-now /auto-register/*）
#
# 流量感知：glue 轮询 c2a 自带日志 API (/api/logs) 判断最近 m 分钟是否有调用，
#          不拦截/代理 c2a 流量（c2a 原生直连）。
#
# 数据流：
#   any-auto-register(原版, :8000) 注册成功
#     → glue 主动轮询同步（兜底 AT 模式 refresh_token 为空的情况）
#     → POST http://chatgpt2api:80/api/accounts
#     → chatgpt2api(原版, :80) 账号池 → 立即可被 /v1 反代消费
#   自动注册：glue 后台检查 c2a 可用账号数，低于 MIN_AVAILABLE 时调 aar /api/tasks/register

services:
  chatgpt2api:
    build:
      context: ../chatgpt2api
    container_name: c2a-app
    environment:
      CHATGPT2API_AUTH_KEY: "${CHATGPT2API_AUTH_KEY:-test_key_123}"
    volumes:
      - c2a_data:/app/data
    ports:
      - "3080:80"
    restart: unless-stopped

  any-auto-register:
    build:
      context: ../any-auto-register
    container_name: aar-app
    entrypoint: ["/bin/sh", "-c"]
    command: ["ln -sf /runtime/account_manager.db /app/account_manager.db; Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp & sleep 3; DISPLAY=:99 exec python main.py"]
    environment:
      # 复用 any-auto-register 原版内置的 contribution_mode=custom 钩子，不改其源码
      CONTRIBUTION_ENABLED: "1"
      CONTRIBUTION_MODE: "custom"
      CUSTOM_CONTRIBUTION_URL: "http://glue:8080/api/upload"
      CUSTOM_CONTRIBUTION_TOKEN: "${GLUE_TOKEN:-glue-shared-secret}"
      # 以下按你实际环境填写（注册需要能访问 ChatGPT 与邮箱服务）
      # CHATGPT_REGISTRATION_MODE: "refresh_token"
      # MAIL_PROVIDER: "cfworker"
      # CFWORKER_API_URL: ""
      # CFWORKER_ADMIN_TOKEN: ""
      # CFWORKER_DOMAIN: ""
    volumes:
      - aar_runtime:/runtime
      - aar_camoufox:/root/.cache
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - glue

  glue:
    build:
      context: ./glue
    container_name: glue-app
    environment:
      C2A_BASE_URL: "http://chatgpt2api:80"
      CHATGPT2API_AUTH_KEY: "${CHATGPT2API_AUTH_KEY:-test_key_123}"
      GLUE_TOKEN: "${GLUE_TOKEN:-glue-shared-secret}"
      # 主动同步轮询间隔（秒）
      SYNC_INTERVAL: "30"
      # ===== 自动注册调度（默认关闭，按需开启）=====
      AUTO_REGISTER_ENABLED: "${AUTO_REGISTER_ENABLED:-false}"
      MIN_AVAILABLE: "${MIN_AVAILABLE:-3}"
      REGISTER_BATCH: "${REGISTER_BATCH:-1}"
      ONLY_ON_TRAFFIC: "${ONLY_ON_TRAFFIC:-false}"
      TRAFFIC_WINDOW_MIN: "${TRAFFIC_WINDOW_MIN:-10}"
      CHECK_INTERVAL: "${CHECK_INTERVAL:-60}"
      AAR_REGISTER_CONCURRENCY: "${AAR_REGISTER_CONCURRENCY:-1}"
      # AAR_REGISTER_MODE: ""  # 空=用 aar 全局配置；可填 refresh_token / access_token 等
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - chatgpt2api

volumes:
  c2a_data:
  aar_runtime:
  aar_camoufox:
